<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <!-- Petrified Human Statue with stone texture and moss cracks -->
  <!-- Ground contact shadow -->
  <ellipse cx="32" cy="86" rx="24" ry="8" fill="#1b2e1e" opacity="0.4"/>
  <!-- Stone pedestal / base -->
  <polygon points="32,74 54,82 32,90 10,82" fill="#52544e" stroke="#373834" stroke-width="2"/>
  <polygon points="32,78 48,84 32,88 16,84" fill="#63665f"/>
  <!-- Legs / Feet in stone -->
  <rect x="22" y="54" width="8" height="24" rx="2" fill="#757971" stroke="#373834" stroke-width="1.5"/>
  <rect x="34" y="54" width="8" height="24" rx="2" fill="#6d7068" stroke="#373834" stroke-width="1.5"/>
  <!-- Stone Tunic / Torso -->
  <polygon points="18,28 46,28 50,56 14,56" fill="#82877d" stroke="#373834" stroke-width="2"/>
  <polygon points="26,28 38,28 40,56 24,56" fill="#93998e"/>
  <!-- Petrified Arms in protective pose -->
  <path d="M16,30 L10,48 L18,46 Z" fill="#7a7f76" stroke="#373834" stroke-width="1.5"/>
  <path d="M48,30 L54,48 L46,46 Z" fill="#70756c" stroke="#373834" stroke-width="1.5"/>
  <!-- Stone Head with cracks -->
  <circle cx="32" cy="18" r="10" fill="#8f948a" stroke="#373834" stroke-width="2"/>
  <path d="M28,12 L34,22" stroke="#2b3b24" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Moss green patches (symbolizing millennia of petrification) -->
  <circle cx="20" cy="40" r="3" fill="#4d6e3f"/>
  <circle cx="44" cy="50" r="4" fill="#3b5930"/>
  <circle cx="36" cy="15" r="2.5" fill="#4d6e3f"/>
</svg>
